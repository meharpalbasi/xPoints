name: Daily FPL Metrics Generation

permissions:
  contents: write
  issues: write

on:
  schedule:
    - cron: "0 0 * * *"  # Runs daily at midnight UTC
  workflow_dispatch:

jobs:
  run-fpl-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run FPL Metrics script
        run: |
          python script2.py

      - name: Commit fpl_full_history_metrics.json to repository
        uses: EndBug/add-and-commit@v9
        with:
          add: "fpl_full_history_metrics.json"
          message: "Update fpl_full_history_metrics.json [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="⚠️ Daily FPL metrics workflow failed"
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Failed again: $url"
          else
            body=$(printf 'Run: %s\n\nNote: the 2025/26 training set this workflow overwrites is preserved as a release asset on the pre-2026-27 tag.' "$url")
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
