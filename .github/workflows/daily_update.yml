name: Daily xPoints Prediction

permissions:
  contents: write
  issues: write

on:
  schedule:
    - cron: "30 16 * * *"  # Runs daily at 16:30 UTC
  workflow_dispatch:

jobs:
  run-prediction:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run prediction model (ep_next baseline on failure)
        run: |
          # script.py trains on current-season history only, so it cannot run
          # pre-season or in the first ~5 gameweeks. When it fails for ANY
          # reason, fall back to baseline.py (FPL's own ep_next, stdlib-only)
          # rather than leaving a stale file in place — a stale predictions.json
          # keyed on last season's element IDs served the wrong player names
          # for 11 weeks in 2026.
          python script.py || {
            echo "::warning::script.py failed — falling back to ep_next baseline"
            python baseline.py
          }

      - name: Archive pre-deadline snapshot
        # Copies predictions.json to predictions/gw{N}.json. The last run before
        # each deadline freezes there, so predictions can later be scored
        # against actual points. Before this file existed, every prediction the
        # project ever made was destroyed by the next day's overwrite.
        run: python baseline.py --archive-only

      - name: Commit predictions to repository
        uses: EndBug/add-and-commit@v9
        with:
          add: "predictions.json predictions/"
          message: "Update predictions.json [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="⚠️ Daily xPoints prediction workflow failed"
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Failed again: $url"
          else
            body=$(printf 'Run: %s\n\nThis workflow previously failed silently for 78 consecutive days. This issue is the alarm — it collects repeat failures until closed.' "$url")
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
