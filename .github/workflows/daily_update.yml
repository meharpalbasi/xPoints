name: Daily xPoints Prediction

permissions:
  contents: write
  issues: write

on:
  schedule:
    # Hourly, off the :00 mark (GitHub's most-delayed slot). A single daily
    # 16:30 run left the frozen pre-deadline snapshot a median of 20 hours
    # stale across the 38 published deadlines, and was observed landing up to
    # 8h32m late. Hourly keeps the last pre-deadline run within ~1h of the
    # deadline; baseline.py only rewrites files when the data actually changed.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Prediction source to attempt
        required: true
        default: baseline
        type: choice
        options:
          - baseline
          - model

# Never let two runs race on predictions.json / the per-GW archive.
concurrency:
  group: predictions-publication
  cancel-in-progress: false

jobs:
  run-prediction:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate validated prediction candidate
        id: generate
        env:
          PREDICTION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'baseline' }}
        run: |
          if [ "$PREDICTION_MODE" = "model" ]; then
            if python script.py; then
              echo "source=model" >> "$GITHUB_OUTPUT"
              echo "fallback_used=false" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::model candidate failed validation — publishing ep_next baseline"
              python baseline.py
              echo "source=fpl_ep_next" >> "$GITHUB_OUTPUT"
              echo "fallback_used=true" >> "$GITHUB_OUTPUT"
            fi
          else
            python baseline.py
            echo "source=fpl_ep_next" >> "$GITHUB_OUTPUT"
            echo "fallback_used=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record publication source
        run: |
          echo "### Prediction publication" >> "$GITHUB_STEP_SUMMARY"
          echo "- Requested mode: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'baseline' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Published source: ${{ steps.generate.outputs.source }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Fallback used: ${{ steps.generate.outputs.fallback_used }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Warn if the model fell back
        if: steps.generate.outputs.fallback_used == 'true'
        run: echo "::warning::Model mode was requested but the ep_next baseline was published instead"

      - name: Archive pre-deadline snapshot
        # Copies predictions.json to predictions/gw{N}.json while the target
        # gameweek's deadline is still in the future; after it passes the file
        # stays frozen so predictions can be scored against actual points.
        run: python baseline.py --archive-only

      - name: Shadow model (never blocks publication)
        # Trains the harness pipeline on 2025/26 + this season and predicts the
        # next gameweek into predictions_model.json + predictions/gw{N}_model.json.
        # Graded by score.py against ep_next on identical rows; the clients keep
        # reading ep_next until the scorecard says the model wins.
        run: python model.py || echo "::warning::shadow model failed — ep_next baseline unaffected"

      - name: Score finished gameweeks
        # Grades each archived pre-deadline snapshot against official results
        # once FPL marks the event data_checked (bonus and DEFCON settled).
        # Gameweeks already scored are skipped; scores/ files are immutable.
        # Scoring must never block publication, so a failure only warns.
        run: python score.py || echo "::warning::scoring step failed — predictions were still published"

      - name: Commit predictions and scores to repository
        uses: EndBug/add-and-commit@v9
        with:
          add: "predictions.json predictions_model.json predictions_model_meta.json predictions/ scores/ scorecard.json"
          message: "Update predictions.json [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Close alert issue on recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="⚠️ Daily xPoints prediction workflow failed"
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --comment "Recovered: $url"
          fi

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="⚠️ Daily xPoints prediction workflow failed"
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Failed again: $url"
          else
            body=$(printf 'Run: %s\n\nThis issue is the alarm — it collects repeat failures and closes itself on the next successful run.' "$url")
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
